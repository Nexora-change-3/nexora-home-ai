<!doctype html>
<meta charset="utf-8">
<title>NEXORA Worker CORS diagnostic</title>
<pre id="result">Checking Worker CORS…</pre>
<script>
(async () => {
  const out = document.getElementById('result');
  try {
    const response = await fetch('https://nexora-ai-visualizer.audiliga.workers.dev/generate', {
      method: 'POST',
      headers: { 'X-NEXORA-KEY': 'nexora-cors-probe-invalid' },
      body: new FormData()
    });
    const body = await response.text();
    out.textContent = 'HTTP ' + response.status + '\n' + body;
  } catch (error) {
    out.textContent = 'BROWSER/CORS ERROR\n' + String(error);
  }
})();
</script>
