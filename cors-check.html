<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — проверка соединения</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:16px;border-radius:10px}</style></head><body><h1>NEXORA — безопасная проверка связи</h1><p>Проверка выполняется без генерации изображения и без использования вашего ключа.</p><pre id="result">Проверяю…</pre><script>
(async()=>{const out=document.getElementById('result');const endpoint='https://nexora-ai-visualizer.audiliga.workers.dev/generate';try{const form=new FormData();const response=await fetch(endpoint,{method:'POST',headers:{'X-NEXORA-KEY':'nexora-diagnostic-invalid-key'},body:form,cache:'no-store'});const body=await response.text();out.textContent='FETCH: успешно\nHTTP: '+response.status+' '+response.statusText+'\nОтвет Worker: '+body+'\nOrigin страницы: '+location.origin+'\nВывод: браузер достиг Worker, CORS работает; 401 ожидаем из-за тестового неверного ключа.';}catch(error){out.textContent='FETCH: ошибка\nТип: '+error.name+'\nСообщение: '+error.message+'\nOrigin страницы: '+location.origin+'\nВывод: браузер не получил доступный HTTP-ответ. Это указывает на CORS или сетевой сбой до ответа Worker.';}})();
</script></body></html>
