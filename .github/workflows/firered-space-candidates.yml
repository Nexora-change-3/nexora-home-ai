name: FireRed candidate Space API inspection

on:
  push:
    branches:
      - experiment/nexora-design-engine
    paths:
      - .github/workflows/firered-space-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pin public Turbo Space and model revisions without inference
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir gradio_client huggingface_hub
          python - <<'PY'
          from gradio_client import Client
          from huggingface_hub import HfApi
          api = HfApi()
          space = "someone-in-the-world/FireRed-Experimental-Turbo"
          info = api.space_info(space)
          print("SPACE_ID", space)
          print("SPACE_SHA", info.sha)
          print("SPACE_RUNTIME", info.runtime.stage if info.runtime else None)
          for model in [
              "FireRedTeam/FireRed-Image-Edit-1.1",
              "prithivMLmods/Qwen-Image-Edit-Rapid-AIO-V23",
          ]:
              try:
                  model_info = api.model_info(model)
                  print("MODEL_REVISION", model, model_info.sha)
              except Exception as exc:
                  print("MODEL_REVISION_UNAVAILABLE", model, type(exc).__name__, repr(exc))
          client = Client(space, verbose=False)
          print("SPACE_URL", client.src)
          client.view_api()
          PY
