name: FireRed candidate Space API inspection

on:
  push:
    branches:
      - experiment/nexora-design-engine
    paths:
      - .github/workflows/firered-space-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect FireRed Turbo API implementation without inference
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir gradio_client huggingface_hub
          python - <<'PY'
          from gradio_client import Client
          from huggingface_hub import HfApi, hf_hub_download
          import re

          spaces = ["someone-in-the-world/FireRed-Experimental-Turbo"]
          api = HfApi()
          for space in spaces:
              print("\n=== SPACE", space, "===")
              client = Client(space, verbose=False)
              print("CONNECTED", client.src)
              client.view_api()
              files = api.list_repo_files(repo_id=space, repo_type="space")
              print("FILES", files[:80])
              for filename in files:
                  if filename.endswith(".py") and (filename == "app.py" or "pipeline" in filename.lower() or "model" in filename.lower()):
                      path = hf_hub_download(repo_id=space, filename=filename, repo_type="space")
                      lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
                      print("\nSOURCE_FILE", filename, "LINES", len(lines))
                      pattern = re.compile(r"FireRed|QwenImage|from_pretrained|base64|json\.loads|@spaces\.GPU|def infer|def load|model_id|repo_id|transformer|steps", re.I)
                      for i, line in enumerate(lines):
                          if pattern.search(line):
                              lo, hi = max(0, i-1), min(len(lines), i+2)
                              for j in range(lo, hi):
                                  print(f"{j+1}: {lines[j][:260]}")
          PY
