name: FireRed candidate Space API inspection

on:
  push:
    branches:
      - experiment/nexora-design-engine
    paths:
      - .github/workflows/firered-space-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public FireRed Space APIs and model identity without inference
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir gradio_client huggingface_hub
          python - <<'PY'
          from gradio_client import Client
          from huggingface_hub import HfApi, hf_hub_download
          import os, re

          candidates = [
              "ysharma/fast-image-studio",
              "someone-in-the-world/FireRed-Experimental-Turbo",
          ]
          api = HfApi()
          for space in candidates:
              print("\n=== SPACE", space, "===")
              try:
                  client = Client(space, verbose=False)
                  print("CONNECTED", client.src)
                  client.view_api()
                  files = api.list_repo_files(repo_id=space, repo_type="space")
                  print("FILES", [f for f in files if f in ("app.py", "requirements.txt", "README.md")])
                  if "app.py" in files:
                      path = hf_hub_download(repo_id=space, filename="app.py", repo_type="space")
                      lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
                      patterns = re.compile(r"FireRed|QwenImage|from_pretrained|@spaces\.GPU|@server\.api|gpu_duration|model_id|repo_id|image_edit", re.I)
                      for i, line in enumerate(lines):
                          if patterns.search(line):
                              lo, hi = max(0, i-1), min(len(lines), i+2)
                              print(f"APP[{lo+1}:{hi}]")
                              for j in range(lo, hi):
                                  print(f"{j+1}: {lines[j][:260]}")
                  if "requirements.txt" in files:
                      path = hf_hub_download(repo_id=space, filename="requirements.txt", repo_type="space")
                      print("REQUIREMENTS", open(path, encoding="utf-8", errors="replace").read()[:3000])
              except Exception as exc:
                  print("UNAVAILABLE", type(exc).__name__, repr(exc))
          PY
