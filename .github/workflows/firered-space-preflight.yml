name: FireRed 1.1 Turbo adapter live smoke test

on:
  push:
    branches:
      - experiment/nexora-design-engine
    paths:
      - .github/workflows/firered-space-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the NEXORA JavaScript adapter against public ZeroGPU
        run: node experiments/nexora-design-engine/scripts/firered-turbo-live-smoke.mjs
      - name: Upload smoke-test output
        uses: actions/upload-artifact@v4
        with:
          name: firered-smoke-output
          path: firered-smoke-output.png
          if-no-files-found: error
          retention-days: 7
