<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — проверка настроек</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:16px;border-radius:10px}</style></head><body><h1>NEXORA — проверка сохранённых настроек</h1><p>Проверка использует сохранённый ключ только локально в этом браузере. Сам ключ нигде не отображается и не передаётся в отчёт. Изображение и запрос генерации не отправляются.</p><pre id="result">Проверяю…</pre><script>
(async()=>{const out=document.getElementById('result');const storeKey='nexora_home_ai_cloudflare_settings';try{const settings=JSON.parse(localStorage.getItem(storeKey)||'{}');const endpoint=String(settings.endpoint||'');const key=String(settings.key||'');const safeEndpoint=endpoint==='https://nexora-ai-visualizer.audiliga.workers.dev/generate';const noLineBreaks=!/[\r\n]/.test(key);const headerValid=(()=>{try{new Headers({'X-NEXORA-KEY':key});return true}catch(e){return false}})();if(!endpoint||!key){out.textContent='НАСТРОЙКИ: отсутствуют\nКлюч сохранён: '+Boolean(key)+'\nАдрес Worker задан: '+Boolean(endpoint)+'\nНужно открыть блок подключения AI и сохранить настройки.';return}if(!headerValid){out.textContent='НАСТРОЙКИ: ключ содержит недопустимые символы заголовка.\nДлина ключа: '+key.length+'\nПереносы строк: '+(!noLineBreaks);return}const form=new FormData();const response=await fetch(endpoint,{method:'POST',headers:{'X-NEXORA-KEY':key},body:form,cache:'no-store'});const body=await response.text();out.textContent='СОХРАНЁННЫЙ КЛЮЧ: '+(response.status===400?'принят Worker (ожидаемый HTTP 400 на пустую форму)':'Worker ответил HTTP '+response.status)+'\nHTTP: '+response.status+' '+response.statusText+'\nОтвет Worker: '+body+'\nАдрес Worker совпадает с ожидаемым: '+safeEndpoint+'\nДлина ключа не менее 24 символов: '+(key.length>=24)+'\nПереносов строк в ключе нет: '+noLineBreaks+'\nЗаголовок допустим для браузера: '+headerValid+'\nOrigin: '+location.origin+'\n\nПустая форма гарантирует, что запрос остановится на проверке входных данных и не вызовет Workers AI.';}catch(error){out.textContent='ПРОВЕРКА НЕ ПРОШЛА\nТип: '+error.name+'\nСообщение: '+error.message+'\nOrigin: '+location.origin+'\nКлюч не отображался. Генерация не запускалась.';}})();
</script></body></html>
